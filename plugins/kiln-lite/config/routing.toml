# Kiln-Lite routes copied from Kiln 4, with Lite role names and call defaults.
# conceptual/operational seats use role names conceptual.0, conceptual.1, etc.

[lanes.balanced]
researcher_gpt = { cli = "codex", model = "gpt-6.1-sol", effort = "medium", timeout_s = 1800, read_only = true }
researcher_claude = { cli = "claude", model = "claude-sonnet-5-5", effort = "medium", timeout_s = 1800, read_only = true }
