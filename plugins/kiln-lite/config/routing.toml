mechanical = { cli = "codex", model = "gpt-6.1-sol", effort = "low", timeout_s = 1800, read_only = false }
conceptual = [ { cli = "codex", model = "gpt-6-astra", effort = "medium", timeout_s = 1800, read_only = true }, { cli = "claude", model = "claude-fable-5-1", effort = "medium", timeout_s = 1800, read_only = true } ]
