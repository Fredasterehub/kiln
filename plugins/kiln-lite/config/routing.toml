review_of_gpt = { cli = "claude", model = "claude-opus-5-5", effort = "medium", timeout_s = 1800, read_only = true }
review_of_claude = { cli = "codex", model = "gpt-6-astra", effort = "medium", timeout_s = 1800, read_only = true }
