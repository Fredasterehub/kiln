# Kiln 4 routing. One lane active; `bosses` overrides the two bridge bosses on top of any lane.
# Model ids are exact (SPEC §4). Never Haiku, never a silent fallback.

active = "balanced"
bosses = "claude"   # "claude" | "gpt"

[lanes.balanced]
boss            = { model = "claude-opus-5-5",   effort = "medium" }
orchestrator    = { model = "claude-opus-5-5",   effort = "medium" }
manager         = { model = "claude-opus-5-5",   effort = "medium" }
gravedigah     = { model = "gpt-6.1-sol",       effort = "medium" }
chunkmaster     = { model = "gpt-6.1-sol",       effort = "medium" }
implementer     = { model = "gpt-6.1-sol",       effort = "medium" }
investigator    = { model = "gpt-6.1-sol",       effort = "medium" }
mechanical      = { model = "gpt-6.1-sol",       effort = "low" }
review_of_gpt   = { model = "claude-opus-5-5",   effort = "medium" }
review_of_claude= { model = "gpt-6-astra",       effort = "medium" }
research_claude = { model = "claude-sonnet-5-5", effort = "medium" }
research_gpt    = { model = "gpt-6.1-sol",       effort = "medium" }   # Fred 2026-10-30: research is investigation
ui_plan         = { model = "claude-fable-5-1",  effort = "medium" }
ui_build        = { model = "claude-opus-5-5",   effort = "medium" }
ui_review       = { model = "gpt-6-astra",       effort = "medium" }
advisor         = { model = "gemini-4-argon-high", effort = "high" }
conceptual      = [ { model = "gpt-6-astra", effort = "medium" }, { model = "claude-fable-5-1", effort = "medium" } ]
operational     = [ { model = "gpt-6.1-sol", effort = "medium" }, { model = "claude-opus-5-5", effort = "medium" } ]

[lanes.claude-lean]
boss            = { model = "claude-opus-5-5",   effort = "medium" }
orchestrator    = { model = "claude-opus-5-5",   effort = "medium" }
manager         = { model = "claude-opus-5-5",   effort = "medium" }   # Fred 2026-10-30: all managers Opus, every lane
gravedigah     = { model = "gpt-6.1-sol",       effort = "medium" }
chunkmaster     = { model = "gpt-6.1-sol",       effort = "medium" }
implementer     = { model = "gpt-6.1-sol",       effort = "medium" }
investigator    = { model = "gpt-6.1-sol",       effort = "medium" }
mechanical      = { model = "gpt-6.1-sol",       effort = "low" }
review_of_gpt   = { model = "claude-opus-5-5",   effort = "medium" }
review_of_claude= { model = "gpt-6-astra",       effort = "medium" }
research_claude = { model = "gpt-6.1-sol",       effort = "low" }
research_gpt    = { model = "gpt-6.1-sol",       effort = "low" }
ui_plan         = { model = "gpt-6-astra",       effort = "medium" }
ui_build        = { model = "gpt-6.1-sol",       effort = "medium" }
ui_review       = { model = "claude-opus-5-5",   effort = "medium" }
advisor         = { model = "gemini-4-argon-high", effort = "high" }
conceptual      = [ { model = "gpt-6-astra", effort = "medium" } ]
operational     = [ { model = "gpt-6.1-sol", effort = "medium" }, { model = "claude-opus-5-5", effort = "medium" } ]

# Boss override: `bosses = "gpt"` applies [boss_lanes.gpt] after the lane, to these two roles only.
[boss_lanes.gpt]
boss            = { model = "gpt-6-astra", effort = "medium" }
orchestrator    = { model = "gpt-6.1-sol", effort = "medium" }
